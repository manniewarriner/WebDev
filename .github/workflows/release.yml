name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/OrchDesk.Tests -c Release

      - name: Publish single-file exe
        run: dotnet publish src/OrchDesk.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: OrchDesk-win-x64
          path: publish/OrchDesk.exe

      - name: Attach exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/OrchDesk.exe
