<section id="results" class="section section--sky results" aria-labelledby="results-title">
  <div class="container">
    <div class="section-head section-head--editorial" data-reveal="fade">
      <div>
        <p class="eyebrow">03 — Results</p>
        <h2 id="results-title" class="h2" data-split>See the <em>proof</em></h2>
      </div>
      <p class="lead results__intro" data-reveal>Drag the squeegee to compare. Pure-water cleaning removes grime, algae, and streaks that regular methods miss. Gutter jobs come with 4K before &amp; after photos as proof.<!-- PLACEHOLDER: add link to client's photo gallery --></p>
    </div>

    <div class="results__tabs" role="tablist" aria-label="Choose a comparison" data-reveal>
      <button class="results__tab is-active" role="tab" aria-selected="true" data-scene="windows">Windows</button>
      <button class="results__tab" role="tab" aria-selected="false" data-scene="gutters">Gutters &amp; fascias</button>
      <span class="results__tab-pill" aria-hidden="true"></span>
    </div>

    <div class="results__frame">
    <div class="results__stage" data-reveal="scale" style="--pos: 50%">
      <!-- shared SVG defs -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <!-- Real photo textures: Poly Haven, CC0 (no attribution required) -->
          <pattern id="r-brick" width="380" height="380" patternUnits="userSpaceOnUse">
            <image href="assets/img/tex/brick_wall_001.webp" width="380" height="380" preserveAspectRatio="none"/>
          </pattern>
          <pattern id="r-roof" width="260" height="260" patternUnits="userSpaceOnUse">
            <image href="assets/img/tex/ceramic_roof_01.webp" width="260" height="260" preserveAspectRatio="none"/>
          </pattern>
          <pattern id="r-stain" width="520" height="520" patternUnits="userSpaceOnUse">
            <image href="assets/img/tex/concrete_wall_003.webp" width="520" height="520" preserveAspectRatio="none"/>
          </pattern>
          <linearGradient id="r-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
          <linearGradient id="r-sky" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFE3C8"/><stop offset=".55" stop-color="#7CC6F2"/><stop offset="1" stop-color="#3A8FCB"/>
          </linearGradient>
          <linearGradient id="r-dull" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8E9690"/><stop offset="1" stop-color="#6E6A5E"/>
          </linearGradient>
          <!-- matte materials: satin uPVC, powder-coat PVC, stone sill, leaf litter -->
          <filter id="r-matte" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="4" result="n"/>
            <feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .22 0" result="g"/>
            <feComposite in="g" in2="SourceGraphic" operator="in" result="gm"/>
            <feBlend in="SourceGraphic" in2="gm" mode="multiply"/>
          </filter>
          <linearGradient id="r-bevel-v" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".15" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></linearGradient>
          <linearGradient id="r-bevel-h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".2" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
          <linearGradient id="r-gutter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3F44"/><stop offset=".3" stop-color="#2A2E32"/><stop offset="1" stop-color="#16191C"/></linearGradient>
          <linearGradient id="r-pipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15181B"/><stop offset=".35" stop-color="#33383D"/><stop offset=".55" stop-color="#2A2E32"/><stop offset="1" stop-color="#121417"/></linearGradient>
          <pattern id="r-stone" width="300" height="300" patternUnits="userSpaceOnUse">
            <image href="assets/img/tex/white_sandstone_bricks_03.webp" width="300" height="300" preserveAspectRatio="none"/>
          </pattern>
          <pattern id="r-litter" width="200" height="200" patternUnits="userSpaceOnUse">
            <image href="assets/img/tex/leafy_grass.webp" width="200" height="200" preserveAspectRatio="none"/>
          </pattern>
          <filter id="r-grime" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".018 .03" numOctaves="4" seed="8"/>
            <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .29  0 0 0 0 .22  0 0 0 1.6 -.55"/>
          </filter>
          <filter id="r-speck" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/>
            <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .18  0 0 0 0 .14  0 0 0 9 -7.4"/>
          </filter>
          <filter id="r-moss" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="21"/>
            <feColorMatrix values="0 0 0 0 .25  0 0 0 0 .38  0 0 0 0 .16  0 0 0 2.2 -1"/>
          </filter>
        </defs>
      </svg>

      <!-- WINDOWS scene -->
      <div class="results__scene is-active" data-scene="windows">
        <svg class="results__layer results__after" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice" role="img" aria-label="After: clean window with a white uPVC frame and stone sill">
          <rect width="1000" height="625" fill="url(#r-brick)"/>
          <rect width="1000" height="625" fill="url(#r-shade)"/>
          <rect x="268" y="52" width="464" height="500" rx="3" fill="#ECEAE4" filter="url(#r-matte)"/>
          <rect x="268" y="52" width="464" height="500" rx="3" fill="url(#r-bevel-v)"/>
          <g>
            <rect x="290" y="74" width="420" height="214" fill="url(#r-sky)"/>
            <rect x="290" y="316" width="420" height="214" fill="url(#r-sky)"/>
            <path d="M330 288 470 74h60L390 288zM560 530l140-214h10v40L620 530z" fill="#fff" opacity=".12"/>
            <path d="M290 230c60-18 120-10 170 4s120 18 250-8v62H290z" fill="#5E9C6E" opacity=".35"/>
          </g>
          <g fill="#ECEAE4" filter="url(#r-matte)"><path d="M492 74h16v214h-16zM492 316h16v214h-16zM290 288h420v28H290z"/></g>
          <path d="M290 288h420v28H290z" fill="url(#r-bevel-h)"/>
          <!-- rubber gaskets around each pane -->
          <g fill="none" stroke="#3B3B3A" stroke-width="2.2" opacity=".85"><path d="M290 74h202v214H290zM508 74h202v214H508zM290 316h202v214H290zM508 316h202v214H508z"/></g>
          <!-- stone sill with a drip groove -->
          <rect x="240" y="552" width="520" height="28" fill="url(#r-stone)"/>
          <rect x="240" y="552" width="520" height="28" fill="#D9D2C2" opacity=".35"/>
          <path d="M240 552h520" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
          <path d="M246 574h508" stroke="#000" stroke-opacity=".22" stroke-width="2"/>
          <rect x="240" y="580" width="520" height="10" fill="#000" opacity=".16"/>
        </svg>

        <svg class="results__layer results__before" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Before: grimy window with algae on the frame and cobwebs">
          <rect width="1000" height="625" fill="url(#r-brick)"/>
          <rect width="1000" height="625" fill="url(#r-shade)"/>
          <rect width="1000" height="625" filter="url(#r-grime)" opacity=".35"/>
          <rect x="268" y="52" width="464" height="500" rx="3" fill="#D6D0C0" filter="url(#r-matte)"/>
          <rect x="290" y="74" width="420" height="214" fill="url(#r-dull)"/>
          <rect x="290" y="316" width="420" height="214" fill="url(#r-dull)"/>
          <rect x="290" y="74" width="420" height="456" filter="url(#r-grime)"/>
          <rect x="290" y="74" width="420" height="456" filter="url(#r-speck)"/>
          <rect x="268" y="52" width="464" height="526" fill="url(#r-stain)" style="mix-blend-mode:multiply" opacity=".9"/>
          <g fill="#CDC6B2" filter="url(#r-matte)"><path d="M492 74h16v214h-16zM492 316h16v214h-16zM290 288h420v28H290z"/></g>
          <g fill="none" stroke="#2E2C27" stroke-width="2.2" opacity=".8"><path d="M290 74h202v214H290zM508 74h202v214H508zM290 316h202v214H290zM508 316h202v214H508z"/></g>
          <!-- algae creeping on the frame -->
          <rect x="268" y="470" width="464" height="82" filter="url(#r-moss)"/>
          <rect x="268" y="52" width="40" height="500" filter="url(#r-moss)" opacity=".7"/>
          <rect x="240" y="552" width="520" height="28" fill="url(#r-stone)"/>
          <rect x="240" y="552" width="520" height="28" fill="#7C735E" opacity=".45" style="mix-blend-mode:multiply"/>
          <rect x="240" y="552" width="520" height="28" filter="url(#r-moss)"/>
          <rect x="240" y="580" width="520" height="10" fill="#000" opacity=".2"/>
          <!-- rain streaks -->
          <g stroke="#5A5040" stroke-width="3" opacity=".35" stroke-linecap="round">
            <path d="M330 90v120M372 100v170M420 84v90M560 96v150M612 90v110M668 110v160M350 330v160M450 340v120M590 330v170M650 340v100"/>
          </g>
          <!-- cobweb in the corner -->
          <g stroke="#F1EEE6" stroke-width="1.4" fill="none" opacity=".75">
            <path d="M710 74 640 74M710 74 710 144M710 74 652 132M710 74 676 140M710 74 646 104"/>
            <path d="M690 74q4 16 20 20M672 74q6 30 38 38M656 74q10 46 54 54"/>
          </g>
          <!-- bird mess -->
          <path d="M406 150c8-6 18-2 16 8-1 8-10 10-6 18-8-2-16-8-14-16z" fill="#F2EFE6" opacity=".9"/>
        </svg>
      </div>

      <!-- GUTTERS scene -->
      <div class="results__scene" data-scene="gutters">
        <svg class="results__layer results__after" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice" role="img" aria-label="After: bright white fascia and an empty, flowing gutter">
          <rect width="1000" height="625" fill="url(#r-sky)"/>
          <path d="M0 0h1000v170H0z" fill="url(#r-roof)"/>
          <path d="M0 150h1000v20H0z" fill="#000" opacity=".25"/>
          <rect x="0" y="170" width="1000" height="70" fill="#ECEAE4" filter="url(#r-matte)"/>
          <rect x="0" y="170" width="1000" height="70" fill="url(#r-bevel-h)"/>
          <rect x="0" y="240" width="1000" height="34" fill="#E2DFD7" filter="url(#r-matte)"/>
          <path d="M0 240h1000" stroke="#000" stroke-opacity=".12" stroke-width="2"/>
          <path d="M0 196h1000v34a26 26 0 0 1-26 26H26A26 26 0 0 1 0 230z" fill="url(#r-gutter)" filter="url(#r-matte)"/>
          <path d="M0 199h1000" stroke="#4B5056" stroke-width="2" opacity=".7"/>
          <g fill="#1B1E21"><rect x="90" y="192" width="14" height="10"/><rect x="330" y="192" width="14" height="10"/><rect x="570" y="192" width="14" height="10"/><rect x="900" y="192" width="14" height="10"/></g>
          <rect x="0" y="274" width="1000" height="351" fill="url(#r-brick)"/>
          <rect x="780" y="252" width="40" height="373" fill="url(#r-pipe)" filter="url(#r-matte)"/>
          <g fill="#14171A"><rect x="776" y="330" width="48" height="12"/><rect x="776" y="520" width="48" height="12"/></g>
        </svg>

        <svg class="results__layer results__before" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Before: green-streaked fascia and a gutter overflowing with leaves and moss">
          <rect width="1000" height="625" fill="#B7C4CC"/>
          <path d="M0 0h1000v170H0z" fill="url(#r-roof)"/>
          <path d="M0 150h1000v20H0z" fill="#000" opacity=".25"/>
          <rect x="0" y="0" width="1000" height="170" filter="url(#r-moss)"/>
          <rect x="0" y="170" width="1000" height="70" fill="#D6D1C2" filter="url(#r-matte)"/>
          <rect x="0" y="170" width="1000" height="104" filter="url(#r-grime)"/>
          <rect x="0" y="170" width="1000" height="104" fill="url(#r-stain)" style="mix-blend-mode:multiply"/>
          <g stroke="#4F6B3A" stroke-width="5" opacity=".45" stroke-linecap="round">
            <path d="M80 240v34M210 240v30M330 240v34M470 240v26M610 240v34M720 240v30M900 240v34"/>
          </g>
          <rect x="0" y="240" width="1000" height="34" fill="#CAC4B2" filter="url(#r-matte)"/>
          <path d="M0 196h1000v34a26 26 0 0 1-26 26H26A26 26 0 0 1 0 230z" fill="url(#r-gutter)" filter="url(#r-matte)"/>
          <g fill="#1B1E21"><rect x="90" y="192" width="14" height="10"/><rect x="330" y="192" width="14" height="10"/><rect x="570" y="192" width="14" height="10"/><rect x="900" y="192" width="14" height="10"/></g>
          <!-- leaves and moss overflowing -->
          <!-- leaf litter, silt and moss clogging the gutter (photo textures, no shine) -->
          <g>
            <path id="r-debris" d="M0 200q40-34 90-10t110-8 120 4 140-12 130 8 150-6 140 8 120-10v28H0z" fill="url(#r-litter)"/>
            <use href="#r-debris" fill="#4E4120" opacity=".55" style="mix-blend-mode:multiply"/>
            <use href="#r-debris" filter="url(#r-moss)" opacity=".7"/>
            <path d="M0 214q120-8 260 0t300-2 260 4 180-4v6H0z" fill="#3B3222" opacity=".6"/>
            <g fill="#6B4E22" opacity=".85"><path d="M112 186q16-14 34-6-14 12-34 6z"/><path d="M296 182q12-16 32-10-12 14-32 10z"/><path d="M514 190q18-12 38-4-16 12-38 4z"/><path d="M700 180q14-14 30-8-12 12-30 8z"/><path d="M876 188q16-12 36-6-14 12-36 6z"/></g>
            <path d="M440 204q6-40 14-60M452 204q10-30 24-44M640 204q-4-36 6-52" stroke="#55692F" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"/>
          </g>
          <rect x="0" y="274" width="1000" height="351" fill="url(#r-brick)"/>
          <rect x="0" y="274" width="1000" height="351" filter="url(#r-grime)" opacity=".5"/>
          <path d="M120 274c0 60 10 120 4 200M560 274c4 70-6 130 0 220" stroke="#3E5530" stroke-width="10" opacity=".35" fill="none"/>
          <rect x="780" y="252" width="40" height="373" fill="url(#r-pipe)" filter="url(#r-matte)"/>
          <rect x="780" y="252" width="40" height="373" filter="url(#r-moss)" opacity=".8"/>
          <g fill="#14171A"><rect x="776" y="330" width="48" height="12"/><rect x="776" y="520" width="48" height="12"/></g>
        </svg>
      </div>

      <span class="results__label results__label--before">Before</span>
      <span class="results__label results__label--after">After</span>

      <!-- Squeegee handle -->
      <div class="results__divider" aria-hidden="true"></div>
      <button class="results__handle" role="slider" aria-label="Before and after comparison" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50% before">
        <span class="results__blade"></span>
        <span class="results__grip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>
    </div>
    <p class="results__caption muted">Illustrated with real material textures. Real job photos are available on request.<!-- PLACEHOLDER: swap in real 4K before/after photos from client --></p>
  </div>
</section>
